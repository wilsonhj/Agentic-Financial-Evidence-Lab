{{- if .Values.acceptance.enabled }}
# All test traffic uses localhost. Enforcement requires a NetworkPolicy CNI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fel.fullname" . }}-acceptance
  labels:
    {{- include "fel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: acceptance
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
{{- end }}
