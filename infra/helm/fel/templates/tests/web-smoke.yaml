apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fel.fullname" . }}-web-smoke
  labels:
    {{- include "fel.labels" . | nindent 4 }}
  annotations:
    {{- include "fel.testAnnotations" (dict "root" . "wave" "-10") | nindent 4 }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    metadata:
      labels:
        {{- include "fel.labels" . | nindent 8 }}
        app.kubernetes.io/component: web-smoke
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-smoke
          image: {{ include "fel.image" .Values.web.image | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          command: [node, --input-type=module, -e]
          args:
            - |
              const base = "http://{{ include "fel.fullname" . }}-web:3000";
              for (const path of ["/api/health", "/extraction-runs"]) {
                const response = await fetch(base + path, { signal: AbortSignal.timeout(10000) });
                if (response.status !== 200) throw new Error(`${path}: HTTP ${response.status}`);
                const text = await response.text();
                if (path === "/extraction-runs" && !text.includes("Create bounded run"))
                  throw new Error("Fixture extraction UI was absent");
                console.log(`${path}: fixture Deployment HTTP 200`);
              }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
