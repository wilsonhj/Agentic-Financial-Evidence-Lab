{{- if .Values.acceptance.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fel.fullname" . }}-acceptance
  labels:
    {{- include "fel.labels" . | nindent 4 }}
  annotations:
    # Preserve both failed and successful logs until the next test or cleanup.
    {{- include "fel.testAnnotations" (dict "root" . "wave" "0") | nindent 4 }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.acceptance.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "fel.labels" . | nindent 8 }}
        app.kubernetes.io/component: acceptance
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-db-credential
          image: {{ include "fel.image" .Values.acceptance.image | quote }}
          imagePullPolicy: {{ .Values.acceptance.image.pullPolicy }}
          command: [/workspace/infra/kubernetes/run-acceptance.sh, --initialize-db-credential]
          env:
            - name: FEL_ACCEPTANCE_LOCAL
              value: "1"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: db-credential
              mountPath: /run/fel-acceptance
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        # A native sidecar ends with the runner; a regular postgres container
        # would keep this Job running forever. Requires Kubernetes >= 1.33.
        - name: postgres
          image: {{ include "fel.image" .Values.acceptance.postgres.image | quote }}
          imagePullPolicy: {{ .Values.acceptance.postgres.image.pullPolicy }}
          restartPolicy: Always
          args: [postgres, -c, listen_addresses=127.0.0.1]
          env:
            - name: POSTGRES_USER
              value: fel
            - name: POSTGRES_PASSWORD_FILE
              value: /run/fel-acceptance/password
            - name: POSTGRES_DB
              value: fel_extraction_acceptance
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            exec:
              # TCP avoids succeeding against initdb's temporary socket server.
              command: [pg_isready, -h, 127.0.0.1, -U, fel, -d, fel_extraction_acceptance]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          volumeMounts:
            - name: db-credential
              mountPath: /run/fel-acceptance
              readOnly: true
            - name: postgres
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.acceptance.postgres.resources | nindent 12 }}
      containers:
        - name: acceptance
          image: {{ include "fel.image" .Values.acceptance.image | quote }}
          imagePullPolicy: {{ .Values.acceptance.image.pullPolicy }}
          command: [/workspace/infra/kubernetes/run-acceptance.sh]
          workingDir: /workspace
          env:
            - name: FEL_ACCEPTANCE_LOCAL
              value: "1"
            - name: FEL_DEPLOYMENT_MODE
              value: synthetic-http
            - name: FEL_SYNTHETIC_HTTP_TARGET
              value: extraction-ci
            - name: FEL_AUTH_MODE
              value: mock
            - name: FEL_ALLOW_MOCK_LLM
              value: "1"
            - name: FEL_WORKER_DB_ROLE
              value: fel_worker
            - name: FEL_STORAGE_DIR
              value: /work/storage
            - name: CROSS_STACK_MANIFEST
              value: /work/manifest.json
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: CI
              value: "1"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: db-credential
              mountPath: /run/fel-acceptance
              readOnly: true
            - name: work
              mountPath: /work
            - name: shm
              mountPath: /dev/shm
          resources:
            {{- toYaml .Values.acceptance.resources | nindent 12 }}
      volumes:
        - name: db-credential
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: postgres
          emptyDir:
            sizeLimit: 2Gi
        - name: work
          emptyDir:
            sizeLimit: 2Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
{{- end }}
