name: Kubernetes lab

on:
  pull_request:
    branches: [main, "integration/**"]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_cluster:
        description: Build native ARM64 images and run disposable kind acceptance
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kubernetes-lab-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Kubernetes lab — chart and regression gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate workflow expressions with pinned actionlint
        run: |
          asset=actionlint_1.7.12_linux_amd64.tar.gz
          release=https://github.com/rhysd/actionlint/releases/download/v1.7.12
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/$asset" "$release/$asset"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/actionlint-checksums.txt" \
            "$release/actionlint_1.7.12_checksums.txt"
          (cd "$RUNNER_TEMP" && grep -F "  $asset" actionlint-checksums.txt | sha256sum --check)
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/kubernetes-lab.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Install hash-locked YAML dependency
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          text = Path("requirements-dev.lock").read_text()
          block = "pyyaml==" + text.split("\npyyaml==", 1)[1].split("\n    #", 1)[0] + "\n"
          Path(os.environ["RUNNER_TEMP"], "lab-pyyaml.lock").write_text(block)
          PY
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/lab-pyyaml.lock"
      - name: Install pinned tools with release checksum verification
        run: |
          bash infra/kubernetes/bootstrap-tools.sh "$RUNNER_TEMP/fel-lab-bin"
          echo "$RUNNER_TEMP/fel-lab-bin" >> "$GITHUB_PATH"
      - name: Run every lab check without skips
        run: bash infra/kubernetes/check-lab.sh 2>&1 | tee "$RUNNER_TEMP/lab-checks.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kubernetes-lab-checks
          path: ${{ runner.temp }}/lab-checks.log
          retention-days: 14

  cluster:
    name: Kubernetes lab — manual ARM64 acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.run_cluster
    needs: checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      FEL_LAB_CLUSTER: fel-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select this runner's isolated state directory
        run: echo "FEL_LAB_STATE=$RUNNER_TEMP/fel-lab-state" >> "$GITHUB_ENV"
      - name: Install pinned tools
        run: |
          bash infra/kubernetes/bootstrap-tools.sh "$RUNNER_TEMP/fel-lab-bin"
          echo "$RUNNER_TEMP/fel-lab-bin" >> "$GITHUB_PATH"
      - run: bash infra/kubernetes/lab.sh doctor
      - run: bash infra/kubernetes/lab.sh build
      - id: create
        run: bash infra/kubernetes/lab.sh create
      - run: bash infra/kubernetes/lab.sh deploy
      - run: bash infra/kubernetes/lab.sh test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kubernetes-lab-arm64-evidence
          path: ${{ runner.temp }}/fel-lab-state/evidence/
          retention-days: 14
      - name: Delete this job's owned cluster
        if: always() && steps.create.outcome == 'success'
        run: bash infra/kubernetes/lab.sh delete
